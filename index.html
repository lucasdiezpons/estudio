<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Estudio</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estudio">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Barra superior -->
  <header id="top">
    <button id="btn-tema" class="pill">Filtrar ▾</button>
    <button id="btn-sonido" class="icon" aria-label="Sonido">🔇</button>
  </header>

  <!-- Feed -->
  <main id="feed" aria-label="Vídeos"></main>

  <!-- Lista de títulos -->
  <section id="lista" hidden>
    <div class="lista-head">
      <h1>Todos los vídeos</h1>
      <input id="buscar" type="search" placeholder="Buscar…" autocomplete="off">
    </div>
    <div id="lista-contenido"></div>
  </section>

  <!-- Selector de tema -->
  <div id="sheet" hidden>
    <div class="sheet-box">
      <div class="sheet-title">Qué estudiar <small>(se guarda en el móvil)</small></div>
      <div id="sheet-temas"></div>
      <button id="sheet-ok">Listo</button>
    </div>
  </div>

  <!-- Barra inferior -->
  <nav id="bottom">
    <button data-vista="feed" class="activo">🏠<span>Inicio</span></button>
    <button data-vista="lista">📚<span>Lista</span></button>
  </nav>

  <!-- Candado -->
  <div id="candado">
    <form id="candado-form" autocomplete="off">
      <div class="c-ico">🔒</div>
      <input id="candado-pin" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="Contraseña" autocomplete="off">
      <button type="submit">Entrar</button>
      <div id="candado-err" hidden>Contraseña incorrecta</div>
    </form>
  </div>

  <div id="toast" hidden></div>
  <script>
  (function () {
    var HASH = "774b1ae19e9b9edbee4cfed6b90c4004654da97f9b678882e59eb0d62889deae", KEY = "acceso";
    var cand = document.getElementById("candado");
    function sha(t) {
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode("estudio:" + t)).then(function (b) {
        return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join("");
      });
    }
    function abrir() {
      cand.remove();
      var s = document.createElement("script"); s.src = "app.js"; document.body.appendChild(s);
    }
    var guardado = ""; try { guardado = localStorage.getItem(KEY) || ""; } catch (e) {}
    if (guardado === HASH) return abrir();
    document.getElementById("candado-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var v = document.getElementById("candado-pin").value.trim();
      sha(v).then(function (h) {
        if (h === HASH) { try { localStorage.setItem(KEY, h); } catch (e) {} abrir(); }
        else { document.getElementById("candado-err").hidden = false; document.getElementById("candado-pin").value = ""; }
      });
    });
  })();
  </script>
</body>
</html>
